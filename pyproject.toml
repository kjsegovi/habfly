[project]
name = "habfly"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kevin Segovia", email = "kjsegovi@icloud.com" }
]
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.3.0",
    "matplotlib>=3.11.2",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "playwright>=1.62.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tensorboard>=2.21.0",
    "torch>=2.14.0",
    "typer>=0.27.2",
]

[project.scripts]
habfly = "habfly:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
