[package]
name = "habfly-tui"
version = "0.1.0"
edition = "2021"
description = "Local terminal observer and controller for the HabFly Python runtime"
license = "MIT"

[dependencies]
crossterm = "0.28.1"
# Match scroll bounds to the pinned renderer's actual word wrapping and Unicode width.
ratatui = { version = "0.29.0", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0", features = ["derive"] }
# Preserve Python's binary64 numeric payloads through display and replay.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
